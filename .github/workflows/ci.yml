name: Meson CI

permissions:
  contents: read

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, migration03 ]
  workflow_dispatch:

jobs:
  build:
    name: Build cross-platform matrix
    uses: ./.github/workflows/build-matrix.yml

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="Aegisub-nyaa-edition-v${version}"
          for asset in \
            "${base}.exe" \
            "${base}-portable.zip" \
            "${base}-update.zip" \
            "${base}-arm64.dmg" \
            "${base}-x86_64.dmg" \
            "${base}-x86_64.AppImage" \
            "${base}.tar.xz"
          do
            test -s "release-assets/${asset}"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="Aegisub-nyaa-edition-v${version}"
          title="nyaa's edition v${version}"
          python tools/release/github_release_notes.py \
            --changelog changelog/en.txt \
            --version "${version}" \
            --output release-notes.md
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "${title}" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}"
          else
            gh release edit "${TAG}" --title "${title}" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}"
          fi
          gh release upload "${TAG}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"

          while IFS= read -r asset; do
            case "${asset}" in
              "${base}.exe"|\
              "${base}-portable.zip"|\
              "${base}-update.zip"|\
              "${base}-arm64.dmg"|\
              "${base}-x86_64.dmg"|\
              "${base}-x86_64.AppImage"|\
              "${base}.tar.xz") ;;
              *) gh release delete-asset "${TAG}" "${asset}" --yes --repo "${GITHUB_REPOSITORY}" ;;
            esac
          done < <(gh release view "${TAG}" --json assets --jq '.assets[].name' --repo "${GITHUB_REPOSITORY}")

          test "$(gh release view "${TAG}" --json assets --jq '.assets | length' --repo "${GITHUB_REPOSITORY}")" -eq 7
